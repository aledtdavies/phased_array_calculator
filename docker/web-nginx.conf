# nginx for the browser version (docker/web.Dockerfile). Browsers load ES modules only when
# they are served as JavaScript, and compile WebAssembly fastest when it is served as
# application/wasm: those two types are set per location (an empty `types` block makes nginx
# use default_type), whatever the image's mime.types holds; everything else keeps the standard
# types from the http block.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ \.mjs$ { types { } default_type text/javascript; expires 30d; add_header Cache-Control "public"; }
    location ~ \.wasm$ { types { } default_type application/wasm; expires 30d; add_header Cache-Control "public"; }
    # Pyodide's files change only with its version: cache them; the page itself is revalidated.
    location /pyodide/ { expires 30d; add_header Cache-Control "public"; }
    location / { add_header Cache-Control "no-cache"; }
    gzip on;
    gzip_types text/javascript application/javascript application/wasm application/json text/css text/plain;
}
