# Plan step 7: build the headless image (docker/Dockerfile), run the test suite in it under Xvfb,
# and render the documentation screenshots. Results and images are uploaded as an artefact.
name: headless

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t pac-headless -f docker/Dockerfile .

      - name: Versions and OpenGL renderer
        run: docker run --rm pac-headless info

      - name: Test suite
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" pac-headless test

      - name: Documentation images
        if: always()
        run: docker run --rm -v "$PWD/out:/out" pac-headless images

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-results
          path: out/
          if-no-files-found: warn

  web:
    # The browser version (plan: web app): the self-contained site as an artefact, and the
    # nginx image built, run and checked for the content types browsers need.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the web image
        run: docker build -t pac-web -f docker/web.Dockerfile .

      - name: Serve it and check what a browser fetches
        run: |
          docker run -d --name pac-web -p 8080:80 pac-web
          sleep 2
          check() {  # url, expected content type
            t=$(curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:8080/$1")
            echo "$1 -> $t"
            case "$t" in "$2"*) ;; *) echo "::error::$1 served as '$t', expected $2"; exit 1 ;; esac
          }
          check index.html text/html
          check worker.js application/javascript
          check config.js application/javascript
          check views.js application/javascript
          check view3d.js application/javascript
          check style.css text/css
          check panels.json application/json
          check vendor/plotly.min.js application/javascript
          check py/materials.json application/json
          curl -fsS -o /dev/null http://localhost:8080/wheels/ezdxf-1.4.5-py3-none-any.whl && echo "ezdxf wheel ok"
          curl -fsS -o /dev/null http://localhost:8080/help.html && echo "help ok"
          check py/session.py text/plain
          check pyodide/pyodide.mjs text/javascript
          check pyodide/pyodide.asm.mjs text/javascript
          check pyodide/pyodide.asm.wasm application/wasm
          check pyodide/pyodide-lock.json application/json
          for w in $(python3 -c "import json,sys; d=json.load(open(sys.argv[1]))['packages']; print(' '.join(d[k]['file_name'] for k in ('numpy','scipy','micropip','pyparsing','typing-extensions','fonttools')))" <(curl -fsS http://localhost:8080/pyodide/pyodide-lock.json)); do
            curl -fsS -o /dev/null "http://localhost:8080/pyodide/$w" && echo "pyodide/$w ok"
          done

      - name: The self-contained site, for any web server
        run: |
          python3 tools/build_web.py site --offline
          (cd site && zip -qr ../pac-web-site.zip .)
          ls -l pac-web-site.zip

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: pac-web-site
          path: pac-web-site.zip

      - name: The page in a real browser (headless Chromium)
        # The browser's own checks (tools/web_smoke.py): Python starts, every tab draws, for a linear
        # probe with a weld and a matrix probe, at desktop and phone width; no page errors.
        run: |
          python3 -m pip install --quiet "playwright==1.65.2"
          python3 -m playwright install --with-deps chromium
          python3 tools/web_smoke.py site web-smoke

      - name: Upload the browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: web-smoke/
          if-no-files-found: warn
