# GitHub Pages (plan: web app, hosting option). Manual for now: it publishes the browser
# version to https://aledtdavies.github.io/phased_array_calculator/ once the owner has set
# Settings > Pages > Source to "GitHub Actions". Change `on:` to `push: branches: [main]` to
# publish every merge.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site (Pyodide copied in)
        run: python tools/build_web.py site --offline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
