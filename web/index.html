<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Phased Array Focal Law Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="setupToggle" class="icon-btn only-narrow" aria-label="Setup" title="Setup">&#9776;</button>
  <div class="brand"><span class="logo" aria-hidden="true">&#9673;</span><span class="title">Focal Law Calculator</span></div>
  <nav class="menu">
    <div class="dropdown">
      <button class="btn ghost" id="fileBtn" aria-haspopup="true" aria-expanded="false">File &#9662;</button>
      <div class="dropdown-menu" id="fileMenu" role="menu">
        <button role="menuitem" data-act="open-config">Open configuration&hellip;</button>
        <button role="menuitem" data-act="save-config">Save configuration</button>
        <hr>
        <button role="menuitem" data-act="cat-probe">Load probe from catalogue&hellip;</button>
        <button role="menuitem" data-act="cat-wedge">Load wedge from catalogue&hellip;</button>
        <hr>
        <button role="menuitem" data-act="export-csv">Export laws (CSV)</button>
        <button role="menuitem" data-act="export-coords">Export element coordinates&hellip;</button>
      </div>
    </div>
    <a class="btn ghost" href="help.html" target="_blank" rel="noopener">Help</a>
  </nav>
</header>

<div class="layout">
  <aside id="setup" class="setup">
    <div class="setup-head only-narrow"><b>Setup</b><button class="icon-btn" id="setupClose" aria-label="Close">&times;</button></div>
    <div id="panels" class="panels"></div>
    <div class="setup-actions">
      <button id="calcBtn" class="btn primary block" disabled>Calculate laws</button>
      <div id="status" class="status">Starting Python in your browser&hellip;</div>
    </div>
  </aside>

  <main class="main">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="rays" role="tab">Rays</button>
      <button class="tab" data-tab="table" role="tab">Laws</button>
      <button class="tab" data-tab="delays" role="tab">Delays</button>
      <button class="tab" data-tab="field" role="tab">Beam field</button>
    </div>

    <section class="view active" id="view-rays">
      <div class="toolbar">
        <label class="inline">Coverage
          <select id="coverage"><option value="0">Off</option><option value="1">Direct</option>
            <option value="2">Direct + 1st skip</option><option value="3">Direct + 2 skips</option></select></label>
        <label class="inline check"><input type="checkbox" id="showAll"> Show all laws</label>
        <span class="hint">Drag the red focus to solve a law there; tap an element for its delay.</span>
      </div>
      <div class="plots" id="rayPlots"><div class="plot" id="plotXZ"></div><div class="plot" id="plotYZ" hidden></div></div>
      <div class="notes" id="notes"></div>
    </section>

    <section class="view" id="view-table">
      <div class="card table-card"><div class="table-wrap"><table id="lawTable"></table></div></div>
    </section>

    <section class="view" id="view-delays">
      <div class="plot tall" id="plotDelays"></div>
      <div class="notes" id="elementInfo">Tap an element (here or in Rays) for its number, delay and time of flight.</div>
    </section>

    <section class="view" id="view-field">
      <div class="toolbar">
        <button id="fieldBtn" class="btn primary" disabled>Compute beam field</button>
        <span id="fieldStatus" class="hint">Uses the inputs under &ldquo;Beam field&rdquo; in Setup.</span>
      </div>
      <div class="plots" id="fieldPlots"><div class="plot" id="plotField"></div><div class="plot" id="plotFieldYZ" hidden></div></div>
      <div class="notes" id="fieldNote"></div>
    </section>

    <div class="lawbar" id="lawbar">
      <button class="icon-btn" id="prevLaw" aria-label="Previous law" disabled>&#9664;</button>
      <div class="sliders">
        <label class="slider"><span id="angleLabel">Angle –</span><input type="range" id="angleSlider" min="0" max="0" value="0" disabled></label>
        <label class="slider" id="skewRow" hidden><span id="skewLabel">Skew –</span><input type="range" id="skewSlider" min="0" max="0" value="0"></label>
      </div>
      <button class="icon-btn" id="nextLaw" aria-label="Next law" disabled>&#9654;</button>
      <button class="icon-btn" id="playBtn" aria-label="Play" disabled>&#9655;</button>
      <div class="lawlabel" id="lawLabel">No laws yet</div>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b>
  <button class="icon-btn" id="modalClose" aria-label="Close">&times;</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" hidden>

<script src="config.js"></script>
<script src="vendor/plotly.min.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
